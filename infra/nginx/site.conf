# Servidor do site institucional estático. O TLS e o redirect de HTTP ficam com
# o Traefik do EasyPanel — aqui dentro é só HTTP na porta 80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O healthcheck do compose bate aqui; não polui o log de acesso.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # O HTML é revalidado sempre: é ele que aponta para os assets, então uma
    # cópia velha em cache é o que faria um deploy novo "não aparecer".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets podem ficar em cache por muito tempo — se um dia forem versionados
    # por hash no nome, isso vira imutável de fato.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de segurança básicos para um site sem formulário nem login.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

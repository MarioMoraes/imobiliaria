# Infraestrutura de desenvolvimento local.
# Sobe PostgreSQL (multi-tenant via RLS), Redis e RabbitMQ.
# Uso: docker compose up -d   (ou: npm run infra:up)

services:
  # pgvector/pgvector:pg16 é o Postgres 16 oficial com a extensão `vector`
  # pré-compilada (MOD-AI: índice do RAG). Substitui postgres:16-alpine — a
  # imagem é Debian, não Alpine, então a libc muda de musl para glibc. O
  # diretório de dados é compatível (mesma major), mas a ordenação de texto
  # depende da libc: ao migrar um volume existente, rode
  # `REINDEX DATABASE imobiliaria` uma vez.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: imobiliaria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imobiliaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imobiliaria}
      POSTGRES_DB: ${POSTGRES_DB:-imobiliaria}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql roda apenas na primeira criação do volume (banco vazio).
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobiliaria} -d ${POSTGRES_DB:-imobiliaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imobiliaria-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: imobiliaria-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # painel de gestão (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Gotenberg: conversão HTML → PDF (MOD-CONTRATO). Stateless. Escuta na 3000
  # dentro do container; mapeada para 3050 no host (evita colidir com o frontend).
  # Segunda camada contra SSRF: o backend já sanea o HTML do modelo
  # (document.ts), mas o Chromium daqui alcança a rede do compose e a rede do
  # host. A deny-list recusa localhost, link-local (metadata de nuvem em
  # 169.254.169.254) e as faixas privadas — assim um recurso que escape do
  # saneamento não vira leitura de serviço interno.
  #
  # O primeiro termo é o default do próprio Gotenberg e precisa ser mantido:
  # nega file://, EXCETO /tmp, que é de onde o Gotenberg lê o index.html que
  # enviamos. Negar file:// por inteiro faz toda conversão responder 403.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: imobiliaria-gotenberg
    command:
      - "gotenberg"
      - "--chromium-deny-list=^file:(?!///tmp/).*|^https?://(localhost|127\\.|0\\.0\\.0\\.0|\\[?::1|169\\.254\\.|10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)"
    ports:
      - "3050:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage (mídia/fotos) é externo em dev também: Cloudflare R2
  # (S3-compatível). Configure as vars S3_* no backend/.env — sem container local.

volumes:
  pgdata:

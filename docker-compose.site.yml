# Site institucional da Offices Tecnologia (estático).
#
# Stack independente da do SaaS: sobe com `-p offices-site`, não tem banco nem
# fila, e o único ponto de contato com o resto é a rede do Traefik. Derrubar ou
# recriar esta stack não encosta na `offices-ai`.
#
#   docker compose -f docker-compose.site.yml --env-file .env.site up -d
#
services:
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # A pasta do site e a config, ambas somente leitura: o container não tem
      # por que escrever em nada aqui.
      - ./site:/usr/share/nginx/html:ro
      - ./infra/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels: &site_labels
      traefik.enable: "true"
      # Duas grafias do MESMO conceito: o provider Docker do Traefik lê
      # `traefik.docker.network`; o provider Swarm da v3 lê `traefik.swarm.network`.
      traefik.docker.network: ${TRAEFIK_NETWORK:-easypanel}
      traefik.swarm.network: ${TRAEFIK_NETWORK:-easypanel}
      traefik.http.routers.offices-site.rule: Host(`${SITE_DOMAIN:?defina SITE_DOMAIN, ex. www.officestecnologia.com.br}`)
      traefik.http.routers.offices-site.entrypoints: ${TRAEFIK_ENTRYPOINT:-https}
      traefik.http.routers.offices-site.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      # Acima de 2 pelo mesmo motivo da stack do SaaS: o EasyPanel mantém um
      # router `https-error-page` com HostRegexp(`.+`) e priority 1. Empatar
      # com ele é sorteio.
      traefik.http.routers.offices-site.priority: "100"
      traefik.http.services.offices-site.loadbalancer.server.port: "80"
    deploy:
      labels: *site_labels
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  # A rede onde o Traefik do EasyPanel já está. `external: true` porque quem a
  # criou foi o EasyPanel — esta stack se conecta, não a gerencia.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-easypanel}
